[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -v --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=60 -m "not network and not airflow"
markers =
    slow: test chạy dbt/graph thật trong sandbox (vài giây mỗi test)
    network: cần mạng (không chạy trong CI)
    airflow: cần cài Airflow riêng (requirements-airflow.txt, không chạy trong CI)
filterwarnings =
    ignore::DeprecationWarning
